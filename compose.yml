services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  who-dat:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DATABASE: who-dat
    volumes:
      - generated:/app/generated
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
    external: true
    name: who-dat-mongo-data

  generated: